<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diff Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench — toolbar, two editor panes side by side, full-width diff below with a sticky change bar */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eef1f6; --line:#d8dde7; --line-strong:#c3cad8;
  --fg:#1a1f2b; --muted:#5f687a; --accent:#2b4fd6; --accent-fg:#ffffff; --accent-soft:#e3e9fd;
  --add-bg:#e7f6ec; --add-ln:#d3eedc; --add-strong:#a9e0bb; --add-fg:#126a3b;
  --del-bg:#fdeded; --del-ln:#f8d9d9; --del-strong:#f4b9b9; --del-fg:#a52121;
  --ok:#17733f; --ok-bg:#e3f3e9; --err:#c02626; --err-bg:#fde9e9; --warn:#93600a; --warn-bg:#fdf3dc;
  --hatch:#dfe3eb; --fold-bg:#eaf0fb;
  --tk-key:#7a3e9d; --tk-str:#0f63a1; --tk-num:#a65406; --tk-kw:#a1306a; --tk-com:#7a8395; --tk-tag:#2449b8; --tk-fn:#4a54a8;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131a; --surface:#171b24; --surface-2:#1d222d; --line:#2a3141; --line-strong:#3a4356;
  --fg:#e0e4ee; --muted:#8e97aa; --accent:#8098ff; --accent-fg:#0f1320; --accent-soft:#232c4d;
  --add-bg:#132a1d; --add-ln:#183522; --add-strong:#22603a; --add-fg:#74d99d;
  --del-bg:#2e1517; --del-ln:#3a1a1d; --del-strong:#6e2429; --del-fg:#ff9393;
  --ok:#74d99d; --ok-bg:#15301f; --err:#ff8a8a; --err-bg:#3a1719; --warn:#f2c46b; --warn-bg:#33270f;
  --hatch:#252b38; --fold-bg:#1b2236;
  --tk-key:#d5a6ff; --tk-str:#82bcff; --tk-num:#f2b56b; --tk-kw:#ff8cc4; --tk-com:#79839a; --tk-tag:#8db0ff; --tk-fn:#b8bfff;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10131a; --surface:#171b24; --surface-2:#1d222d; --line:#2a3141; --line-strong:#3a4356;
  --fg:#e0e4ee; --muted:#8e97aa; --accent:#8098ff; --accent-fg:#0f1320; --accent-soft:#232c4d;
  --add-bg:#132a1d; --add-ln:#183522; --add-strong:#22603a; --add-fg:#74d99d;
  --del-bg:#2e1517; --del-ln:#3a1a1d; --del-strong:#6e2429; --del-fg:#ff9393;
  --ok:#74d99d; --ok-bg:#15301f; --err:#ff8a8a; --err-bg:#3a1719; --warn:#f2c46b; --warn-bg:#33270f;
  --hatch:#252b38; --fold-bg:#1b2236;
  --tk-key:#d5a6ff; --tk-str:#82bcff; --tk-num:#f2b56b; --tk-kw:#ff8cc4; --tk-com:#79839a; --tk-tag:#8db0ff; --tk-fn:#b8bfff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
.wrap{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
@media (max-width:600px){.wrap{padding-inline:16px}}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:500 20px/1 var(--mono);flex:none}
.brand h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.keys{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
kbd{font:500 11px/1 var(--mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:3px 5px;background:var(--surface);color:var(--fg)}

/* buttons */
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;line-height:1.3;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.field select{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:5px 8px;font-size:13px}
.detected{font:500 11.5px/1 var(--mono);color:var(--accent);background:var(--accent-soft);padding:4px 7px;border-radius:4px}
.check{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.tsep{width:1px;align-self:stretch;background:var(--line)}
.tactions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
@media (max-width:760px){.tsep{display:none}.tactions{margin-left:0}}

/* panes */
.inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.inputs{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.phead{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;flex-wrap:wrap}
.pname{display:flex;align-items:center;gap:8px;margin-right:auto}
.pname h3{margin:0;font-size:14px;font-weight:600}
.side{font:600 11px/1 var(--mono);width:20px;height:20px;border-radius:4px;display:grid;place-items:center}
.side.a{background:var(--del-ln);color:var(--del-fg)}
.side.b{background:var(--add-ln);color:var(--add-fg)}
.tag{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line-strong);border-radius:4px;padding:1px 6px}
.chip{font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px 2px 8px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--err-bg);color:var(--err)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.idle{background:var(--surface-2);color:var(--muted)}
.pact{display:flex;gap:2px;flex-wrap:wrap}
.editor{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);height:22rem;min-height:9rem;resize:vertical;overflow:hidden;border-top:1px solid var(--line);background:var(--surface)}
.editor.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.gutter{margin:0;padding:10px 8px 40px 12px;min-width:3.2rem;text-align:right;color:var(--muted);font:12.5px/20px var(--mono);white-space:pre;overflow:hidden;user-select:none;background:var(--surface-2);border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.gutter b{display:inline-block;width:100%;font-weight:500;color:var(--err);background:var(--err-bg);box-shadow:-12px 0 0 var(--err-bg),8px 0 0 var(--err-bg)}
.band{position:absolute;right:0;height:20px;background:var(--err-bg);pointer-events:none;z-index:0;border-left:2px solid var(--err)}
.editor textarea{position:relative;z-index:1;margin:0;border:0;outline:none;resize:none;width:100%;height:100%;padding:10px 12px;font:12.5px/20px var(--mono);background:transparent;color:var(--fg);white-space:pre;overflow:auto;tab-size:2}
.editor textarea::placeholder{color:var(--muted)}
.perr{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:var(--err-bg);color:var(--err);font-size:13px}
.perr.warn{background:var(--warn-bg);color:var(--warn)}
.perr svg{flex:none;margin-top:2px}
.perr div{min-width:0;flex:1}
.perr strong{display:block;font-weight:600}
.perr p{margin:2px 0 0;color:var(--fg);font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.perr .btn{border-color:currentColor;background:transparent;color:inherit;padding:4px 10px;flex:none}

/* result */
.result{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.rbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}
.rtitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-right:auto}
.rtitle h2{margin:0;font-size:15px;font-weight:600}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pill{font:500 12px/1 var(--mono);padding:4px 7px;border-radius:4px;font-variant-numeric:tabular-nums}
.pill.add{background:var(--add-bg);color:var(--add-fg)}
.pill.del{background:var(--del-bg);color:var(--del-fg)}
.pill.same{background:var(--ok-bg);color:var(--ok);font-family:var(--sans)}
.rctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.nav{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted)}
.nav .btn{padding:4px 7px;display:grid;place-items:center}
.nav span{min-width:4.6rem;text-align:center;font-variant-numeric:tabular-nums}
.hint{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--warn-bg);color:var(--warn);font-size:13px;border-bottom:1px solid var(--line)}
.diffwrap{overflow-x:auto;border-radius:0 0 10px 10px}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
table.d{width:100%;border-collapse:collapse;table-layout:fixed;font:12.5px/20px var(--mono)}
.nowrap table.d{table-layout:auto;width:max-content;min-width:100%}
table.d col.ln{width:3.4rem}
table.d col.sg{width:1.4rem}
table.d td{padding:0;vertical-align:top}
td.ln{text-align:right;padding:0 8px 0 4px;color:var(--muted);user-select:none;font-variant-numeric:tabular-nums}
td.sg{text-align:center;user-select:none;font-weight:500}
td.cd{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;padding:0 14px 0 2px}
.nowrap td.cd{white-space:pre}
table.split td:nth-child(4){border-left:1px solid var(--line)}
td.del{background:var(--del-bg)} td.ln.del{background:var(--del-ln);color:var(--del-fg)} td.sg.del{color:var(--del-fg)}
td.add{background:var(--add-bg)} td.ln.add{background:var(--add-ln);color:var(--add-fg)} td.sg.add{color:var(--add-fg)}
td.emp{background:repeating-linear-gradient(-45deg,var(--hatch) 0 1px,transparent 1px 7px),var(--surface)}
mark.rm{background:var(--del-strong);color:inherit;border-radius:2px}
mark.ins{background:var(--add-strong);color:inherit;border-radius:2px}
tr.cur>td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.fold td{background:var(--fold-bg);border-block:1px solid var(--line)}
tr.fold button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:3px 14px;font:12px/20px var(--mono);color:var(--accent)}
tr.fold button:hover{text-decoration:underline}
tr.fold button span{color:var(--muted)}
/* syntax */
.hljs-attr,.hljs-property,.hljs-attribute{color:var(--tk-key)}
.hljs-string,.hljs-regexp,.hljs-symbol{color:var(--tk-str)}
.hljs-number,.hljs-literal{color:var(--tk-num)}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-type,.hljs-meta .hljs-keyword{color:var(--tk-kw)}
.hljs-comment,.hljs-quote,.hljs-meta{color:var(--tk-com);font-style:italic}
.hljs-tag,.hljs-name,.hljs-selector-class,.hljs-selector-id,.hljs-section,.hljs-bullet{color:var(--tk-tag)}
.hljs-title,.hljs-function .hljs-title,.hljs-title.function_,.hljs-variable,.hljs-template-variable{color:var(--tk-fn)}
.hljs-strong{font-weight:600}.hljs-emphasis{font-style:italic}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;max-width:min(90vw,520px);transition:opacity .18s,transform .18s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--err);color:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

body{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">±</div>
      <div>
        <h1>Diff Bench</h1>
        <p>Paste two versions of code or an API response, beautify them, and see every change line by line.</p>
      </div>
    </div>
    <div class="keys">
      <span><kbd>F7</kbd> next change</span>
      <span><kbd>Shift</kbd> <kbd>F7</kbd> previous</span>
      <span><kbd>Shift</kbd> <kbd>Alt</kbd> <kbd>F</kbd> beautify pane</span>
      <button class="btn ghost" id="loadExample">Load example</button>
    </div>
  </header>

  <div class="toolbar">
    <label class="field">Language
      <select id="lang">
        <option value="auto">Auto-detect</option>
        <option value="json">JSON</option>
        <option value="javascript">JavaScript</option>
        <option value="typescript">TypeScript</option>
        <option value="html">HTML</option>
        <option value="xml">XML</option>
        <option value="css">CSS</option>
        <option value="scss">SCSS</option>
        <option value="yaml">YAML</option>
        <option value="markdown">Markdown</option>
        <option value="plaintext">Plain text</option>
      </select>
    </label>
    <span class="detected" id="detected" hidden></span>
    <label class="field">Indent
      <select id="indent">
        <option value="2">2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tabs</option>
      </select>
    </label>
    <span class="tsep"></span>
    <label class="check"><input type="checkbox" id="sortKeys"> Sort JSON keys on beautify</label>
    <label class="check"><input type="checkbox" id="ignoreWs"> Ignore whitespace</label>
    <div class="tactions">
      <button class="btn" id="swap">Swap sides</button>
      <button class="btn primary" id="beautifyBoth">Beautify both</button>
    </div>
  </div>

  <section class="inputs">
    <article class="pane" id="pane-a">
      <div class="phead">
        <div class="pname"><span class="side a">A</span><h3>Original</h3><span class="tag" id="ex-a" hidden>Example</span></div>
        <span class="chip idle" id="chip-a">Empty</span>
        <div class="pact">
          <button class="btn ghost" data-act="beautify" data-p="a">Beautify</button>
          <button class="btn ghost" data-act="open" data-p="a">Open file</button>
          <button class="btn ghost" data-act="copy" data-p="a">Copy</button>
          <button class="btn ghost" data-act="clear" data-p="a">Clear</button>
        </div>
      </div>
      <div class="editor" id="ed-a">
        <pre class="gutter" id="gut-a" aria-hidden="true">1</pre>
        <div class="band" id="band-a" hidden></div>
        <textarea id="ta-a" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Original code" placeholder="Paste the original version here, or drop a file"></textarea>
      </div>
      <div class="perr" id="err-a" role="alert" hidden></div>
      <input type="file" id="file-a" hidden>
    </article>

    <article class="pane" id="pane-b">
      <div class="phead">
        <div class="pname"><span class="side b">B</span><h3>Modified</h3><span class="tag" id="ex-b" hidden>Example</span></div>
        <span class="chip idle" id="chip-b">Empty</span>
        <div class="pact">
          <button class="btn ghost" data-act="beautify" data-p="b">Beautify</button>
          <button class="btn ghost" data-act="open" data-p="b">Open file</button>
          <button class="btn ghost" data-act="copy" data-p="b">Copy</button>
          <button class="btn ghost" data-act="clear" data-p="b">Clear</button>
        </div>
      </div>
      <div class="editor" id="ed-b">
        <pre class="gutter" id="gut-b" aria-hidden="true">1</pre>
        <div class="band" id="band-b" hidden></div>
        <textarea id="ta-b" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Modified code" placeholder="Paste the version to compare against, or drop a file"></textarea>
      </div>
      <div class="perr" id="err-b" role="alert" hidden></div>
      <input type="file" id="file-b" hidden>
    </article>
  </section>

  <section class="result" aria-label="Differences">
    <div class="rbar">
      <div class="rtitle"><h2>Differences</h2><div class="stats" id="stats"></div></div>
      <div class="rctl">
        <div class="seg" role="group" aria-label="Diff layout">
          <button id="vSplit" aria-pressed="true">Side by side</button>
          <button id="vInline" aria-pressed="false">Inline</button>
        </div>
        <label class="check"><input type="checkbox" id="wrap" checked> Wrap lines</label>
        <div class="nav">
          <button class="btn" id="prev" title="Previous change (Shift+F7)" aria-label="Previous change"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
          <span id="navpos">–</span>
          <button class="btn" id="next" title="Next change (F7)" aria-label="Next change"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        </div>
      </div>
    </div>
    <div class="hint" id="hint" hidden></div>
    <div class="diffwrap" id="diff"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);
const LH = 20, PADT = 10, CONTEXT = 3;
const LABEL = {json:'JSON',javascript:'JavaScript',typescript:'TypeScript',html:'HTML',xml:'XML',css:'CSS',scss:'SCSS',yaml:'YAML',markdown:'Markdown',plaintext:'Plain text'};
const HL = {json:'json',javascript:'javascript',typescript:'typescript',html:'xml',xml:'xml',css:'css',scss:'scss',yaml:'yaml',markdown:'markdown'};
const PJS = 'https://cdn.jsdelivr.net/npm/prettier@3.3.3/';
const PLUG = {javascript:['babel','estree'],typescript:['typescript','estree'],css:['postcss'],scss:['postcss'],html:['html','babel','estree','postcss'],yaml:['yaml'],markdown:['markdown']};
const PARSER = {javascript:'babel',typescript:'typescript',css:'css',scss:'scss',html:'html',yaml:'yaml',markdown:'markdown'};
const STORE = 'diffbench.v1';

const state = {lang:'auto',indent:'2',ignoreWs:false,sortKeys:false,view:innerWidth<720?'inline':'split',wrap:true,expanded:new Set(),cur:-1,count:0,lastLang:null,example:false};
const P = {};
['a','b'].forEach(k => P[k] = {k, name:k==='a'?'Original':'Modified', ta:$('#ta-'+k), gut:$('#gut-'+k), band:$('#band-'+k), chip:$('#chip-'+k), err:$('#err-'+k), file:$('#file-'+k), ed:$('#ed-'+k), ex:$('#ex-'+k), res:{status:'empty'}, seq:0, lines:-1, errLine:null, tabOut:false, vt:0});

const esc = s => s.replace(/[&<>]/g, c => c==='&'?'&amp;':c==='<'?'&lt;':'&gt;');
const ind = () => state.indent==='tab' ? '\t' : ' '.repeat(+state.indent);
function lineCol(src, pos){ pos = Math.max(0, Math.min(pos ?? src.length, src.length)); let line=1, last=-1; for(let i=0;i<pos;i++) if(src.charCodeAt(i)===10){line++; last=i;} return {line, col:pos-last}; }

/* ---------- strict JSON parser (keeps raw numbers, reports line/column) ---------- */
function parseJSON(src){
  let i = 0; const n = src.length;
  const fail = (msg, pos=i) => { const e = new Error(msg); e.pos = pos; throw e; };
  const where = pos => 'line ' + lineCol(src,pos).line;

/* ---------- XML ---------- */
function checkXML(src){

  if(!pe) return null;
  const txt = pe.textContent.replace(/Below is a rendering[\s\S]*$/,'');
  let m = /line (\d+) at column (\d+):\s*([^\n]+)/i.exec(txt);
  if(m) return {line:+m[1], col:+m[2], msg:m[3].trim()};
  m = /XML Parsing Error:\s*([^\n]+)[\s\S]*?Line Number (\d+), Column (\d+)/i.exec(txt);
  if(m) return {line:+m[2], col:+m[3], msg:m[1].trim()};
  return {line:null, col:null, msg:(txt.split('\n').find(s => s.trim()) || 'Invalid XML').trim()};
}
function formatXML(src, I){

  for(let k=0;k<toks.length;k++){
    const t = toks[k];
    if(t.startsWith('</')){ lvl--; out.push(pad()+t.trim()); }
    else if(/^<[A-Za-z_]/.test(t) && !t.endsWith('/>')){
      const a = toks[k+1], b = toks[k+2];
      if(a!==undefined && !a.startsWith('<') && b && b.startsWith('</')){ out.push(pad()+t+a.trim()+b); k+=2; }
      else if(a && a.startsWith('</')){ out.push(pad()+t+a); k++; }
      else { out.push(pad()+t); lvl++; }
    }
    else if(!t.startsWith('<')){ const s = t.trim(); if(s) out.push(pad()+s); }
    else out.push(pad()+t);

}

/* ---------- Prettier (loaded on demand) ---------- */
const loaded = {};

    const s = document.createElement('script'); s.src = url; s.onload = res;
    s.onerror = () => { delete loaded[url]; const e = new Error('Could not load the checker for this language. Check your connection and try again.'); e.isLoadError = true; rej(e); };

async function prettierFormat(text, lang){

/* ---------- validation ---------- */
async function check(text, lang){
  if(!text.trim()) return {status:'empty'};
  if(lang==='json'){
    try { return {status:'ok', ast:parseJSON(text)}; }
    catch(e){ const lc = lineCol(text, e.pos); return {status:'error', msg:e.message, line:lc.line, col:lc.col}; }
  }
  if(lang==='xml'){ const r = checkXML(text); return r ? {status:'error', ...r} : {status:'ok'}; }
  if(lang==='plaintext') return {status:'none'};
  try { return {status:'ok', formatted: await prettierFormat(text, lang)}; }
  catch(e){
    if(e.isLoadError) return {status:'unavailable', msg:e.message};
    const msg = String(e.message || e).split('\n')[0].replace(/\s*\(\d+:\d+\)\s*$/,'');
    const l = e.loc && e.loc.start;
    return {status:'error', msg, line:l?l.line:null, col:l?(l.column||1):null};
  }
}
function detect(text){
  const s = text.trim();
  if(!s) return 'json';
  if(s[0]==='{' || s[0]==='[') return 'json';
  if(s[0]==='<') return /^<!doctype html|^<html|<(head|body|div|span|p|script|section|main|a)\b/i.test(s) ? 'html' : 'xml';
  if(!window.hljs) return 'plaintext';
  const r = hljs.highlightAuto(s.slice(0,4000), ['javascript','typescript','css','scss','yaml','markdown']);
  return r.language && r.relevance >= 4 ? r.language : 'plaintext';
}
function curLang(){
  if(state.lang!=='auto') return state.lang;
  return detect(P.a.ta.value.trim() ? P.a.ta.value : P.b.ta.value);
}
function showDetected(){
  const d = $('#detected');
  if(state.lang==='auto' && (P.a.ta.value.trim() || P.b.ta.value.trim())){ d.hidden = false; d.textContent = 'Detected: ' + LABEL[curLang()]; }
  else d.hidden = true;
}

async function validate(p){
  const seq = ++p.seq, lang = curLang(), text = p.ta.value;
  if(text.trim() && PLUG[lang]){ p.res = {status:'loading', lang}; renderStatus(p); }
  const r = await check(text, lang);
  if(seq!==p.seq) return r;
  p.res = {...r, lang}; renderStatus(p); p.lines = -1; updateGutter(p);
  return p.res;
}

/* ---------- beautify ---------- */
async function beautify(p, silent){
  const text = p.ta.value;
  if(!text.trim()){ if(!silent) toast(`${p.name} is empty. Paste something first.`); return 'empty'; }
  const lang = curLang();
  p.seq++;
  const r = await check(text, lang);
  p.res = {...r, lang}; renderStatus(p); p.lines = -1; updateGutter(p);
  if(r.status==='error'){
    toast(`${p.name} has invalid ${LABEL[lang]}${r.line?` on line ${r.line}`:''}. Fix it, then beautify again.`, 'bad');
    return 'error';
  }
  if(r.status==='unavailable'){ toast(r.msg, 'bad'); return 'error'; }
  let out;
  if(lang==='json') out = printJSON(r.ast, ind(), state.sortKeys);
  else if(lang==='xml') out = formatXML(text, ind());
  else if(lang==='plaintext') out = text.replace(/\r\n?/g,'\n').replace(/[ \t]+$/gm,'');
  else out = r.formatted;
  out = out.replace(/\s+$/,'');
  if(out!==text) setText(p, out);
  if(!silent) toast(`${p.name} beautified as ${LABEL[lang]}`);
  return 'ok';
}
async function beautifyBoth(){
  const [a,b] = [await beautify(P.a,true), await beautify(P.b,true)];
  if(a!=='error' && b!=='error' && (a==='ok'||b==='ok')) toast(`Beautified both sides as ${LABEL[curLang()]}`);
  else if(a==='empty' && b==='empty') toast('Both panes are empty. Paste something first.');

/* ---------- diff ---------- */
function splitHtmlLines(html){
  const out = []; const stack = []; let cur = '', m;
  const re = /(<span[^>]*>)|(<\/span>)|(\n)|([^<\n]+)/g;
  while((m = re.exec(html))){
    if(m[1]){ stack.push(m[1]); cur += m[1]; }
    else if(m[2]){ stack.pop(); cur += m[2]; }
    else if(m[3]){ out.push(cur + '</span>'.repeat(stack.length)); cur = stack.join(''); }
    else cur += m[4];
  }
  out.push(cur);
  return out;
}
function highlightLines(text, lang){
  const lines = text.split('\n');
  const hl = HL[lang];
  if(window.hljs && hl && text.length < 1500000){
    try {
      const h = splitHtmlLines(hljs.highlight(text, {language:hl, ignoreIllegals:true}).value);
      if(h.length===lines.length) return h;
    } catch(e){}
  }
  return lines.map(esc);
}
function intra(a, b){
  if(a.length + b.length > 4000) return null;
  const parts = Diff.diffWordsWithSpace(a, b); let same = 0;
  for(const p of parts) if(!p.added && !p.removed) same += p.value.length;
  if(a.length + b.length && 2*same/(a.length+b.length) < 0.3) return null;
  let L = '', R = '';
  for(const p of parts){
    const v = esc(p.value);
    if(p.added) R += `<mark class="ins">${v}</mark>`;
    else if(p.removed) L += `<mark class="rm">${v}</mark>`;
    else { L += v; R += v; }
  }
  return [L, R];
}
function renderDiff(){

}
function navText(){
  $('#navpos').textContent = !state.count ? 'No changes' : state.cur<0 ? `${state.count} change${state.count===1?'':'s'}` : `${state.cur+1} of ${state.count}`;
  $('#prev').disabled = $('#next').disabled = !state.count;
}
function go(dir){
  if(!state.count) return;
  state.cur = state.cur<0 ? (dir>0 ? 0 : state.count-1) : (state.cur + dir + state.count) % state.count;
  const box = $('#diff');
  box.querySelectorAll('tr.cur').forEach(r => r.classList.remove('cur'));
  const row = box.querySelector(`tr[data-chg="${state.cur}"]`);
  if(row){
    row.classList.add('cur');
    const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    row.scrollIntoView({block:'center', behavior:smooth?'smooth':'auto'});
  }
  navText();
}

/* ---------- toast ---------- */
let toastT = 0;
function toast(msg, kind){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (kind==='bad' ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 3200);
}

/* ---------- wiring ---------- */
Object.values(P).forEach(p => {
  p.ta.addEventListener('input', () => changed(p));
  p.ta.addEventListener('scroll', () => syncScroll(p));
  p.ta.addEventListener('keydown', e => {
    if(e.key==='Escape'){ p.tabOut = true; return; }
    if(e.key==='Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey && !p.tabOut){
      e.preventDefault();
      if(!document.execCommand('insertText', false, ind())){
        const s = p.ta.selectionStart; p.ta.setRangeText(ind(), s, p.ta.selectionEnd, 'end'); changed(p);
      }
      return;
    }
    p.tabOut = false;
    if(e.altKey && e.shiftKey && e.code==='KeyF'){ e.preventDefault(); beautify(p); }
  });
  p.file.addEventListener('change', () => { const f = p.file.files[0]; if(f) readFile(p, f); p.file.value = ''; });
  p.ed.addEventListener('dragover', e => { if([...e.dataTransfer.types].includes('Files')){ e.preventDefault(); p.ed.classList.add('drop'); } });
  p.ed.addEventListener('dragleave', () => p.ed.classList.remove('drop'));
  p.ed.addEventListener('drop', e => { p.ed.classList.remove('drop'); const f = e.dataTransfer.files[0]; if(f){ e.preventDefault(); readFile(p, f); } });
  new ResizeObserver(() => syncScroll(p)).observe(p.ed);
});
function readFile(p, f){
  if(f.size > 8e6){ toast(`${f.name} is larger than 8 MB. Pick a smaller file.`, 'bad'); return; }
  const r = new FileReader();
  r.onload = () => { p.ta.value = String(r.result); p.ta.scrollTop = 0; changed(p, true); toast(`Loaded ${f.name} into ${p.name}`); };
  r.onerror = () => toast(`Could not read ${f.name}`, 'bad');
  r.readAsText(f);
}
document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
  const p = P[b.dataset.p], act = b.dataset.act;
  if(act==='beautify') beautify(p);
  else if(act==='open') p.file.click();
  else if(act==='clear'){ p.ta.value = ''; changed(p, true); p.ta.focus(); }
  else if(act==='copy'){
    const v = p.ta.value;
    if(!v){ toast(`${p.name} is empty`); return; }
    const fallback = () => { p.ta.focus(); p.ta.select(); toast('Text selected. Press Ctrl+C or Cmd+C to copy.'); };
    try { navigator.clipboard.writeText(v).then(() => toast(`Copied ${p.name}`), fallback); } catch(e){ fallback(); }
  }
}));
$('#beautifyBoth').onclick = beautifyBoth;
$('#swap').onclick = () => {
  const a = P.a.ta.value; P.a.ta.value = P.b.ta.value; P.b.ta.value = a;
  changed(P.a, true); changed(P.b, true); toast('Swapped Original and Modified');
};
$('#lang').onchange = e => { state.lang = e.target.value; state.lastLang = curLang(); showDetected(); validate(P.a); validate(P.b); renderDiff(); save(); };
$('#indent').onchange = e => { state.indent = e.target.value; save(); toast('Indent applies the next time you beautify'); };
$('#sortKeys').onchange = e => { state.sortKeys = e.target.checked; save(); };
$('#ignoreWs').onchange = e => { state.ignoreWs = e.target.checked; renderDiff(); save(); };
$('#wrap').onchange = e => { state.wrap = e.target.checked; renderDiff(); save(); };
function setView(v){ state.view = v; $('#vSplit').setAttribute('aria-pressed', v==='split'); $('#vInline').setAttribute('aria-pressed', v==='inline'); renderDiff(); save(); }
$('#vSplit').onclick = () => setView('split');
$('#vInline').onclick = () => setView('inline');
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#diff').addEventListener('click', e => { const b = e.target.closest('[data-fold]'); if(b){ state.expanded.add(+b.dataset.fold); renderDiff(); } });
document.addEventListener('keydown', e => { if(e.key==='F7'){ e.preventDefault(); go(e.shiftKey ? -1 : 1); } });
$('#loadExample').onclick = () => { loadExample(); toast('Loaded the example responses'); };
